[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "github-to-pdf"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "click>=8",
    "httpx>=0.27",
    "pygments>=2.17",
    "reportlab>=4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-httpx>=0.30",
    "Pillow",
]

[project.scripts]
github-to-pdf = "github_to_pdf.cli:main"
